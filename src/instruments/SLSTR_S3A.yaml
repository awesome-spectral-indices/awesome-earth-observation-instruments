id: SLSTR_S3A
name: Sea and Land Surface Temperature Radiometer
acronym: SLSTR
type: multispectral
platform_type: satellite
platform:
  - Sentinel-3A
operator:
  - ESA
  - EUMETSAT
  - Copernicus
start_date: 2016-02-16
status: operational
availability: public
contributors:
  - "https://github.com/davemlz"
references:
  - "https://sentiwiki.copernicus.eu/web/s3-slstr-instrument"
  - "https://sentiwiki.copernicus.eu/web/slstr-products"
  - "https://www.esa.int/Applications/Observing_the_Earth/Copernicus/Sentinel-3/About_the_launch"
  - "https://www.earthdata.nasa.gov/data/instruments/slstr"
  - "https://database.eohandbook.com/database/instrumentsummary.aspx?instrumentID=902"
  - "https://sentiwiki.copernicus.eu/__attachments/a_aacdd1ba3831d1eefcea7c4d52b0cf9b26e65378d1a6f307f13e433ef353e10b/SLSTR_FM02_Spectral_Responses_Necdf_zip.zip"
notes: >-
  SLSTR uses nadir and oblique views to improve atmospheric correction and
  surface-temperature retrievals. The recorded 1470 km swath is the nominal
  nadir-view coverage; the oblique view covers approximately 768 km. F1 and F2
  share the spectral responses of S7 and S8, respectively, but use an extended
  dynamic range for active-fire observations. The nominal band definitions are
  shared by SLSTR-A and SLSTR-B, while their SRFs come from separate pre-flight
  calibration measurements.

