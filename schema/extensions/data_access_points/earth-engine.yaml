$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/awesome-spectral-indices/awesome-earth-observation-instruments/main/schema/extensions/data_access_points/earth-engine.yaml
title: Earth Engine Extension
type: object

required:
  - primary

properties:

  primary:
    type: object
    description: Primary Earth Engine dataset metadata for this instrument
    additionalProperties: false
    required:
      - docs
      - collection
    properties:
      docs:
        type: string
        description: Link to the documentation of the primary data
      collection:
        type: string
        description: Earth Engine collection name
  
  raw:
    type: object
    description: Optional Earth Engine metadata for raw (unprocessed) products
    additionalProperties: false
    required:
      - docs
      - collection
    properties:
      docs:
        type: string
        description: Link to the documentation of raw data
      collection:
        type: string
        description: Earth Engine collection name

  boa:
    type: object
    description: Optional Earth Engine metadata for bottom-of-atmosphere (BOA) products
    additionalProperties: false
    required:
      - docs
      - collection
    properties:
      docs:
        type: string
        description: Link to the documentation of BOA data
      collection:
        type: string
        description: Earth Engine collection name

  toa:
    type: object
    description: Optional Earth Engine metadata for top-of-atmosphere (TOA) products
    additionalProperties: false
    required:
      - docs
      - collection
    properties:
      docs:
        type: string
        description: Link to the documentation of TOA data
      collection:
        type: string
        description: Earth Engine collection name

  lst:
    type: object
    description: Optional Earth Engine metadata for land surface temperature (LST) products
    additionalProperties: false
    required:
      - docs
      - collection
    properties:
      docs:
        type: string
        description: Link to the documentation of LST data
      collection:
        type: string
        description: Earth Engine collection name

  wst:
    type: object
    description: Optional Earth Engine metadata for water surface temperature (WST) products
    additionalProperties: false
    required:
      - docs
      - collection
    properties:
      docs:
        type: string
        description: Link to the documentation of WST data
      collection:
        type: string
        description: Earth Engine collection name

  grd:
    type: object
    description: Optional Earth Engine metadata for ground range detected (GRD) products
    additionalProperties: false
    required:
      - docs
      - collection
    properties:
      docs:
        type: string
        description: Link to the documentation of GRD data
      collection:
        type: string
        description: Earth Engine collection name

  rtc:
    type: object
    description: Optional Earth Engine metadata for radiometrically terrain corrected (RTC) products
    additionalProperties: false
    required:
      - docs
      - collection
    properties:
      docs:
        type: string
        description: Link to the documentation of RTC data
      collection:
        type: string
        description: Earth Engine collection name

additionalProperties: false
